<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Informasi lengkap tentang Sweet Crumbs Bakery">
    <title>Sweet Crumbs Bakery | Informasi Toko Roti</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fffaf5;
            color: #3d2921;
            line-height: 1.6;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 250, 245, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #a6532c;
        }

        .logo span {
            color: #e49a55;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        nav ul li a {
            text-decoration: none;
            color: #3d2921;
            font-weight: bold;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #c76735;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            padding: 140px 8% 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            background: linear-gradient(135deg, #fff4e7, #ffe0bd);
        }

        .hero-text {
            max-width: 600px;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            background: white;
            color: #b65e32;
            border-radius: 30px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(42px, 6vw, 70px);
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #c76735;
        }

        .hero p {
            color: #70584c;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 25px;
            border-radius: 30px;
            background: #a6532c;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(166,83,44,0.3);
        }

        .hero-image {
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: linear-gradient(145deg, #d9904e, #8d4428);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 150px;
            box-shadow: 0 25px 60px rgba(100,50,20,0.25);
        }

        /* SECTION */
        section {
            padding: 90px 8%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title small {
            color: #c76735;
            font-weight: bold;
        }

        .section-title h2 {
            font-size: 40px;
            margin-top: 8px;
        }

        /* PROFIL */
        .profil {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .profil-image {
            min-height: 380px;
            border-radius: 30px;
            background: #f4d1a8;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 130px;
        }

        .profil-text h2 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .profil-text p {
            color: #70584c;
            margin-bottom: 15px;
        }

        /* SEJARAH */
        .sejarah {
            background: #fff0df;
        }

        .sejarah-box {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(80,40,20,0.08);
        }

        .sejarah-box p {
            color: #70584c;
            margin-bottom: 15px;
        }

        /* JENIS ROTI */
        .jenis-roti {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .roti-card {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(80,40,20,0.08);
            transition: 0.3s;
        }

        .roti-card:hover {
            transform: translateY(-8px);
        }

        .roti-icon {
            width: 120px;
            height: 120px;
            margin: auto auto 20px;
            border-radius: 50%;
            background: #f4d1a8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }

        .roti-card h3 {
            margin-bottom: 10px;
        }

        .roti-card p {
            color: #806b5f;
            font-size: 14px;
        }

        /* KEUNGGULAN */
        .keunggulan {
            background: #3d2921;
            color: white;
        }

        .keunggulan .section-title small {
            color: #e49a55;
        }

        .keunggulan-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .keunggulan-card {
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            text-align: center;
        }

        .keunggulan-card .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .keunggulan-card p {
            color: #d9c6bb;
            font-size: 14px;
            margin-top: 10px;
        }

        /* INFORMASI */
        .informasi {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .info-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(80,40,20,0.08);
        }

        .info-card h3 {
            color: #a6532c;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .info-card p {
            color: #70584c;
            margin: 8px 0;
        }

        /* KONTAK */
        .kontak {
            text-align: center;
            background: #fff0df;
        }

        .kontak p {
            color: #70584c;
        }

        .kontak-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .kontak-item {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .kontak-item strong {
            color: #a6532c;
        }

        /* FOOTER */
        footer {
            background: #3d2921;
            color: white;
            text-align: center;
            padding: 25px;
        }

        footer p {
            color: #d9c6bb;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {

            .hero {
                flex-direction: column;
                text-align: center;
            }

            .hero-image {
                width: 320px;
                height: 320px;
                font-size: 110px;
            }

            .profil {
                grid-template-columns: 1fr;
            }

            .jenis-roti {
                grid-template-columns: repeat(2, 1fr);
            }

            .keunggulan-grid {
                grid-template-columns: 1fr;
            }

            .informasi {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {

            nav {
                padding: 15px 5%;
            }

            nav ul {
                display: none;
            }

            section {
                padding: 70px 5%;
            }

            .hero {
                padding-left: 5%;
                padding-right: 5%;
            }

            .jenis-roti {
                grid-template-columns: 1fr;
            }

            .profil-text h2 {
                font-size: 32px;
            }

            .section-title h2 {
                font-size: 32px;
            }

            .sejarah-box {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">
            Sweet<span>Crumbs</span> 🥐
        </div>

        <ul>
            <li><a href="#home">Beranda</a></li>
            <li><a href="#profil">Profil</a></li>
            <li><a href="#sejarah">Sejarah</a></li>
            <li><a href="#roti">Jenis Roti</a></li>
            <li><a href="#kontak">Kontak</a></li>
        </ul>
    </nav>


    <!-- BERANDA -->
    <section class="hero" id="home">

        <div class="hero-text">

            <div class="badge">
                🥐 Informasi Toko Roti
            </div>

            <h1>
                Selamat Datang di
                <span>Sweet Crumbs Bakery</span>
            </h1>

            <p>
                Sweet Crumbs Bakery adalah toko roti yang menyediakan
                berbagai macam roti dan pastry dengan cita rasa lezat
                serta bahan-bahan berkualitas.
            </p>

            <a href="#profil" class="btn">
                Kenali Toko Kami →
            </a>

        </div>

        <div class="hero-image">
            🍞
        </div>
